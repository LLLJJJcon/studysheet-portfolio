name: studysheet

services:
  client:
    build: ./client
    ports:
      - "5173:5173"
    depends_on:
      - server
    environment:
      - VITE_API_URL=http://localhost:3001/api
    develop:
      watch:
        - action: sync
          path: ./client/src
          target: /app/src
        - action: sync
          path: ./client/index.html
          target: /app/index.html
        - action: sync
          path: ./client/vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ./client/package.json

  server:
    build: ./server
    ports:
      - "3001:3001"
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/studysheet
      - PORT=3001
      - NODE_ENV=development
    volumes:
      - uploads:/app/uploads
    develop:
      watch:
        - action: sync
          path: ./server/src
          target: /app/src
        - action: rebuild
          path: ./server/package.json

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
  uploads:
